services:
  - type: web
    name: mi-pwa-api
    runtime: node
    plan: free
    buildCommand: npm ci
    startCommand: npm run start:realtime
    envVars:
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_SUBJECT
        sync: false

  - type: web
    name: mi-pwa-angular
    runtime: static
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist/pwa/browser
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
